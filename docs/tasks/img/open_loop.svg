<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>

  <rect x="140" y="20" width="470" height="200" rx="10" fill="#dceaf9" stroke="#6a9bd8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="375" y="46" text-anchor="middle" font-weight="bold" font-size="19">PART 1: computed, never checked</text>

  <rect x="630" y="20" width="440" height="200" rx="10" fill="#d6f1ec" stroke="#4fb3a5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="850" y="46" text-anchor="middle" font-weight="bold" font-size="19">Each servo: P-only loop</text>

  <text x="20" y="122">Target</text>
  <text x="20" y="144">pose X<tspan font-size="12" dy="4">d</tspan></text>
  <line x1="110" y1="132" x2="168" y2="132" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="168" y="92" width="140" height="80" rx="4" fill="#b8d3f2" stroke="#333" stroke-width="2"/>
  <text x="238" y="125" text-anchor="middle" font-weight="bold">IK</text>
  <text x="238" y="148" text-anchor="middle" font-size="14">Task 4 / MoveIt</text>
  <line x1="308" y1="132" x2="400" y2="132" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="354" y="122" text-anchor="middle">q<tspan font-size="12" dy="4">d</tspan></text>

  <rect x="400" y="92" width="170" height="80" rx="4" fill="#b8d3f2" stroke="#333" stroke-width="2"/>
  <text x="485" y="125" text-anchor="middle" font-weight="bold">Trajectory</text>
  <text x="485" y="148" text-anchor="middle" font-size="14">Tasks 2, 5 / MoveIt</text>
  <line x1="570" y1="132" x2="690" y2="132" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="122" text-anchor="middle">q<tspan font-size="12" dy="4">cmd</tspan></text>

  <rect x="690" y="92" width="150" height="80" rx="4" fill="#7fcfc3" stroke="#333" stroke-width="2"/>
  <text x="765" y="125" text-anchor="middle" font-weight="bold">Servo P</text>
  <text x="765" y="148" text-anchor="middle" font-size="14">K·(q<tspan font-size="10" dy="3">cmd</tspan><tspan dy="-3"> − q)</tspan></text>
  <line x1="840" y1="132" x2="900" y2="132" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="92" width="150" height="80" rx="4" fill="#7fcfc3" stroke="#333" stroke-width="2"/>
  <text x="975" y="125" text-anchor="middle" font-weight="bold">Motor, gears</text>
  <text x="975" y="148" text-anchor="middle" font-weight="bold">&amp; links</text>
  <line x1="975" y1="58" x2="975" y2="90" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="965" y="76" text-anchor="end" fill="#c0392b" font-weight="bold" font-size="15">gravity</text>

  <polyline points="975,172 975,200 765,200 765,174" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1050" y1="132" x2="1185" y2="132" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="112" text-anchor="middle">Actual X</text>
  <text x="1118" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold">≠ X<tspan font-size="12" dy="4">d</tspan></text>

  <text x="600" y="262" text-anchor="middle" fill="#c0392b" font-size="16">No arrow comes back to the left: nothing compares where the arm IS with where it SHOULD be.</text>
</svg>
