# IK for MoveIt (bonus). The SO-100 has 5 arm joints, so a full 6-D pose (position + orientation)
# is usually unreachable. With position_only_ik the solver ignores orientation; orientation is then
# enforced by the OrientationConstraint in your goal (see so100_labs/bonus_moveit_goals.py).
manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
